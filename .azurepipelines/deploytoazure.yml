# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- none

schedules:
- cron: "0 16 8-16 * 2"
  displayName: Weekly build schedule - Second Tuesday of each month at 9 AM PT
  branches:
    include:
    - main

jobs:
- job: DeployWindows2022Image
  displayName: Deploy Windows 2022 Image to Azure
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: AzureCLI@2
    displayName: 'Delete existing Windows Server 2022 Image Template if exists'
    inputs:
      azureSubscription: 'AzureDevOpsEvalations'
      scriptType: pscore
      scriptLocation: 'inlineScript'
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $resourceGroup = 'communitypublic'
        $templateName = 'itws2022jpeast'

        $existing = az image builder show --resource-group $resourceGroup --name $templateName -o json 2>$null
        if (-not $existing) {
          Write-Host "No existing image template '$templateName' found."
          exit 0
        }

        # A template whose build is still running cannot be deleted. Without cancelling it
        # first, the delete fails with OperationNotAllowed and the deployment below then
        # fails with "Update/Upgrade of image templates is currently not supported".
        $runState = ($existing | ConvertFrom-Json).lastRunStatus.runState
        if ($runState -eq 'Running') {
          Write-Host "Image template '$templateName' has a build in progress. Cancelling it..."
          az image builder cancel --resource-group $resourceGroup --name $templateName
          if ($LASTEXITCODE -ne 0) { throw "Failed to cancel the running build of '$templateName'." }

          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline) {
            $runState = az image builder show --resource-group $resourceGroup --name $templateName --query "lastRunStatus.runState" -o tsv 2>$null
            if ($runState -ne 'Running') { break }
            Start-Sleep -Seconds 15
          }
          if ($runState -eq 'Running') { throw "Build of '$templateName' is still running 15 minutes after it was cancelled." }
        }

        Write-Host "Existing image template '$templateName' found. Deleting..."
        az image builder delete --resource-group $resourceGroup --name $templateName
        if ($LASTEXITCODE -ne 0) { throw "Failed to delete image template '$templateName'." }
        Write-Host "Image template deleted successfully."
  - task: AzureCLI@2
    displayName: 'Build Windows Server 2022 Image Template'
    inputs:
      azureSubscription: 'AzureDevOpsEvalations'
      scriptType: pscore
      scriptLocation: 'inlineScript'
      inlineScript: |
        az deployment group create --resource-group communitypublic --template-file $(build.SourcesDirectory)/images/windows2022image.bicep --parameters aibName=aib-communityimagecreator gallaryImageName=imgws2022jp imageTemplateName=itws2022jpeast AzureComputingGallery=sig_windows_jajp
  - task: AzureCLI@2
    condition: succeeded()
    displayName: 'create Azure Windows Server 2022 Image'
    inputs:
      azureSubscription: 'AzureDevOpsEvalations'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az image builder run --resource-group communitypublic --name itws2022jpeast --no-wait

